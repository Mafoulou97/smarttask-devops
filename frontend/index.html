<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SmartTask</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 80px; }
    h1 { color: #2c3e50; }
    #status { margin-top: 20px; font-size: 18px; color: #27ae60; }
  </style>
</head>
<body>
  <h1>SmartTask - Application de gestion de tâches</h1>
  <p id="status">Connexion au backend en cours...</p>
  <script>
    fetch('http://192.168.84.129:5000')
      .then(res => res.text())
      .then(data => document.getElementById('status').innerText = 'Réponse du backend : ' + data)
      .catch(() => document.getElementById('status').innerText = 'Backend injoignable');
  </script>
</body>
</html>
